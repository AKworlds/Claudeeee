services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      DASH_DATA_DIR: /srv/dashboard/data
      DASH_CONFIG: /config/dashboard.yaml
    volumes:
      - ../data:/srv/dashboard/data
      - ../config:/config:ro
      - ../secrets:/secrets:ro
    restart: unless-stopped
    # no published ports: only caddy can reach the app

  caddy:
    image: caddy:2.8
    # Caddy only needs DASH_DOMAIN; the app handles login, so the password hash/secret stay out of this container.
    environment:
      DASH_DOMAIN: ${DASH_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
